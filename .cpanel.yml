---
deployment:
  tasks:
    - export DEPLOYPATH=/home/vzwmozxb/public_html/
    - export LOGFILE=/home/vzwmozxb/public_html/deploy-log.txt
    - export NVM_DIR=$HOME/.nvm
    - '[ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"'
    - echo "=== Deploy start $(date) ===" > $LOGFILE
    - '{ echo "--- environment ---"; which node; which npm; node -v; npm -v; echo "PATH=$PATH"; } >> $LOGFILE 2>&1'
    - '{ echo "--- install ---"; npm ci || npm install; } >> $LOGFILE 2>&1'
    - '{ echo "--- build ---"; npm run build; } >> $LOGFILE 2>&1'
    - /bin/mkdir -p $DEPLOYPATH
    - '{ echo "--- copy dist ---"; ls -la dist 2>&1; /bin/cp -R dist/. $DEPLOYPATH; } >> $LOGFILE 2>&1'
    - /bin/cp -f .htaccess $DEPLOYPATH
    - echo "=== Deploy end $(date) ===" >> $LOGFILE
